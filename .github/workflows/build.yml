name: Build
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest # D1 : Windows V1, WebView2 natif (ADR-0001/0008)
    steps:
      - uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (shared + csrc + viewer.exe + tests)
        run: cmake --build build -j --config Release

      - name: Tests unitaires C++ + intégration (CTest)
        env:
          DASHBOARD_REPO_ROOT: ${{ github.workspace }}
        run: ctest --test-dir build --output-on-failure --build-config Release

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Tests JS du viewer (node --test)
        working-directory: viewer/src/web
        run: npm test --silent

      - name: Tests de contrat (golden-file)
        run: python tests/contract/test_contract.py

      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/viewer/Release/viewer.exe dist/
          Copy-Item build/modelica/csrc/Release/DashboardExternal.dll dist/
          Copy-Item -Recurse modelica/Dashboard dist/Dashboard

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: modelica-dashboard-${{ github.sha }}
          path: dist/

      # Release GitHub sur tag v*.*.* (ADR-0007/0008)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
