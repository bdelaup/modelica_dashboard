name: Build
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read

jobs:
  # Job Linux (portage tests) : shared + csrc + tests, tous les tests CTest
  # (unitaires + integration end_to_end + benchmark framing) + contrat.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: CTest (unitaires + integration + benchmark)
        env:
          DASHBOARD_REPO_ROOT: ${{ github.workspace }}
        run: ctest --test-dir build --output-on-failure
      - name: Tests de contrat (golden-file)
        run: python3 tests/contract/test_contract.py
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: modelica-dashboard-linux-${{ github.sha }}
          path: |
            build/modelica/csrc/libDashboardExternal.so
            build/shared/shared_tests

  # Job Windows V1 : DLL C externe + tests + packaging + release (ADR-0007, ADR-0015).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j --config Release
      - name: CTest
        env:
          DASHBOARD_REPO_ROOT: ${{ github.workspace }}
        run: ctest --test-dir build --output-on-failure --build-config Release
      - name: Tests de contrat
        run: python tests/contract/test_contract.py
      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/modelica/csrc/Release/DashboardExternal.dll dist/
          Copy-Item -Recurse -Force modelica/Dashboard dist/Dashboard
      - uses: actions/upload-artifact@v6
        with:
          name: modelica-dashboard-windows-${{ github.sha }}
          path: dist/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
